services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: adaptive
      POSTGRES_USER: adaptive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptive -d adaptive"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    env_file: .env
    environment:
      ADAPTIVE_DATABASE_URL: postgresql+psycopg://adaptive:${POSTGRES_PASSWORD}@postgres:5432/adaptive
      ADAPTIVE_FRONTEND_ORIGIN: ${ADAPTIVE_FRONTEND_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres-data:
